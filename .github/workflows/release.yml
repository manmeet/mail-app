name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 1: Build + sign on macOS (expensive runner, kept short) ──────────
  build-and-sign:
    runs-on: macos-latest
    environment: main
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:unit

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # For stable tags (exactly X.Y.Z with no suffix), zero-pad to 3 parts
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS='.' read -ra PARTS <<< "$VERSION"
            while [ ${#PARTS[@]} -lt 3 ]; do PARTS+=("0"); done
            VERSION="${PARTS[0]}.${PARTS[1]}.${PARTS[2]}"
          fi
          echo "Setting package version to $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build
        env:
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID_BACKUP }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET_BACKUP }}
          VITE_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: npm run build

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Install Apple intermediate CA certificates
        run: |
          curl -sfL -o /tmp/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          # Import may fail if cert already exists in the .p12 bundle — that's OK
          security import /tmp/DeveloperIDG2CA.cer -t cert -k ~/Library/Keychains/signing_temp.keychain || true

      - name: Verify signing identity
        run: |
          security find-identity -v -p codesigning
          if security find-identity -v -p codesigning | grep -q "0 valid identities found"; then
            echo "ERROR: No valid signing identities found"
            exit 1
          fi

      - name: Build distributables (signed)
        run: npx electron-builder --publish never
        timeout-minutes: 10

      - name: Submit for notarization and wait
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls release/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No .dmg file found in release/"
            exit 1
          fi
          echo "Submitting $DMG for notarization and waiting for result..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          retention-days: 7

  # ── Job 2: Staple notarization ticket on macOS ───────────────────────────
  staple:
    needs: build-and-sign
    runs-on: macos-latest
    environment: main
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: Staple notarization ticket to DMG
        run: |
          for dmg in release/*.dmg; do
            echo "Stapling $dmg..."
            xcrun stapler staple "$dmg"
          done

      - name: Upload stapled artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-stapled
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          retention-days: 7

  # ── Job 3: Upload release assets (cheap Linux runner) ────────────────────
  release:
    needs: [build-and-sign, staple]
    if: |
      needs.build-and-sign.result == 'success' &&
      needs.staple.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Download stapled artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-stapled
          path: release

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Detect pre-release tags (e.g. v1.2.3-beta.1, v1.2.3-rc.1)
          PRERELEASE_FLAG=""
          LATEST_FLAG=""
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            PRERELEASE_FLAG="--prerelease"
            LATEST_FLAG="--latest=false"
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" 2>/dev/null || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE_FLAG $LATEST_FLAG
          # Ensure flags are set even if the release already existed
          if [[ -n "$PRERELEASE_FLAG" ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" release/* --clobber
